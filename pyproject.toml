[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finsage"
version = "1.0.0"
authors = [
  { name="FinSage Team" },
]
description = "Financial Management API with ML-powered expense tracking"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
env = [
    "DATABASE_URL=postgresql://dev:devpass@localhost:5432/finsage_test",
    "SECRET_KEY=test_secret_key",
    "MODEL_PATH=tests/fixtures/test_model.pt"
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if settings.DEBUG",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]